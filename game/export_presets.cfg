; Export presets. Android: arm64-v8a only (reference phone Xiaomi 15T Pro, docs/07-TECHNOLOGIA.md),
; Mobile renderer on Vulkan (R-015). Signing keys never live in the repository: debug export uses the
; editor's debug keystore, release keys come from GODOT_ANDROID_KEYSTORE_RELEASE_* environment variables.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,scenarios/*.json"
exclude_filter="tests/*"
export_path="../build-android/bogowie-olimpu.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=43
version/name="0.0.43"
package/unique_name="pl.bogowieolimpu.game"
package/name="Bogowie Olimpu"
package/signed=true
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
graphics/opengl_debug=false
xr_features/xr_mode=0
permissions/internet=false
